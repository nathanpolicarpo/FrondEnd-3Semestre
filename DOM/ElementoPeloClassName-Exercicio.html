<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .corsim{
            color: green
        }
        .cornao{
            color: red
        }
    </style>
</head>
<body>
    <input type="text" id="fruta" placeholder="digite o nome da fruta"/>
    <select name="" id="nomeClass">
        <option value="">Selecione</option>
        <option value="corsim">corsim</option>
        <option value="cornao">CorNao</option>
    </select>
    <button onclick="cadastrarFruta();" type="button">Cadastrar</button>

    <ul id="listaFruta">
        <li class="corsim">Amora</li>
    </ul>


    <script>
        function cadastrarFruta(){
            const fruta = document.getElementById("fruta").value;
            const nomeClass = document.getElementById("nomeClass").value;
            const listaFruta = document.getElementById("listaFruta");


            
            console.log(fruta);
            console.log(nomeClass);
            console.log(listaFruta);

            if(fruta.trim().length == 0 || nomeClass.trim().length == 0){
                alert("Preencha os campos para cadastrar a fruta");
                return false;
            }

            //cadastrar a fruta
            const li = document.createElement("li");
            li.textContent = fruta;
            li.className = nomeClass;
            listaFruta.appendChild(li);

            
        }
    </script>
</body>
</html>
